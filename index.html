<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buscando a Howie - Hotel Challenge</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body { width: 100%; height: 100%; background: #111; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; }
        
        #marcador { height: 60px; background: #1e272e; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; z-index: 100; flex-shrink: 0; }
        #nivel-actual { font-size: 13px; font-weight: 800; color: #f1c40f; background: #2c3e50; padding: 4px 8px; border-radius: 12px; }
        #timer { font-size: 16px; font-weight: bold; color: #d63031; background: #fff; padding: 4px 10px; border-radius: 20px; }
        #objetivos { display: flex; gap: 8px; align-items: center; justify-content: center; flex: 1; overflow-x: auto; }
        .objetivo-item { background: #2c3e50; padding: 3px 8px; border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
        .objetivo-item img { width: 28px; height: 28px; object-fit: contain; background: #fff; border-radius: 50%; }
        .objetivo-item.encontrado { background: #27ae60; text-decoration: line-through; opacity: 0.4; }

        #lupa-preview { position: fixed; top: 75px; left: 50%; transform: translateX(-50%) scale(0); width: 110px; height: 110px; background: #fff; border: 4px solid #f1c40f; border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 200; opacity: 0; transition: transform 0.15s, opacity 0.15s; }
        #lupa-preview.activa { transform: translateX(-50%) scale(1); opacity: 1; }
        #lupa-preview img { width: 85px; height: 85px; object-fit: contain; }

        #zona-juego { flex: 1; position: relative; background: #000; overflow: auto; display: flex; justify-content: center; align-items: center; }
        #capa-interactiva { position: relative; display: inline-block; line-height: 0; transform-origin: center center; }
        #imagen-fondo { display: block; max-width: 100vw; max-height: calc(100vh - 65px); width: auto; height: auto; }

        /* CIRCULOS ROJOS DE PRUEBA (VISIBLES SIEMPRE) */
       .click-target {
     position: absolute;
     width: 55px; 
     height: 55px; 
     border-radius: 50%;
     transform: translate(-50%, -50%);
     cursor: pointer;
     z-index: 100 !important; /* 👈 Esto fuerza que quede ARRIBA de la foto */
     display: flex;
     justify-content: center;
     align-items: center;
     pointer-events: auto !important;
     }

        /* CIRCULO VERDE CUANDO LO TOCAS */
        .click-target.marcado-exito {
     background-color: rgba(46, 204, 113, 0.5) !important;
     border: 4px solid #2ecc71 !important;
     box-shadow: 0 0 15px #2ecc71 !important;
        }
        .click-target.marcado-exito::after {
            content: "✔";
            color: #fff;
            font-size: 26px;
            font-weight: bold;
        }

        #controles-zoom { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 150; }
        .btn-zoom { width: 48px; height: 48px; border-radius: 50%; background: #f1c40f; color: #2c3e50; font-size: 26px; font-weight: bold; border: 3px solid #fff; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .pantalla-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; text-align: center; padding: 20px; }
        .oculto { display: none !important; }
        .btn { background: #27ae60; color: white; border: none; padding: 14px 30px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; margin-top: 20px; }
        .btn-reiniciar { background: #e74c3c; }
    </style>
</head>
<body>

    <div id="pantalla-inicio" class="pantalla-overlay">
        <h1>¡Buscando a Howie!</h1>
        <p>Encontrá a Howie y los objetos perdidos en el hotel antes de que se acabe el tiempo.</p>
        <button class="btn" onclick="iniciarJuego()">¡Empezar a Jugar!</button>
    </div>

    <div id="marcador">
        <div id="nivel-actual">1/3</div>
        <div id="objetivos"></div>
        <div id="timer">⏱️ 45</div>
    </div>

    <div id="lupa-preview"><img id="lupa-img" src=""></div>

    <div id="zona-juego">
        <div id="contenedor-scroll">
            <div id="capa-interactiva">
                <img id="imagen-fondo" src="">
                <div id="contenedor-objetos"></div>
            </div>
        </div>
    </div>

    <div id="controles-zoom">
        <div class="btn-zoom" onclick="cambiarZoom(0.35)">+</div>
        <div class="btn-zoom" onclick="cambiarZoom(-0.35)">-</div>
    </div>

    <div id="pantalla-siguiente" class="pantalla-overlay oculto">
        <h1>¡Excelente!</h1>
        <button class="btn" onclick="cargarNivelSiguiente()">Siguiente Nivel</button>
    </div>

    <div id="pantalla-perdiste" class="pantalla-overlay oculto">
        <h1 style="color: #e74c3c;">¡Se acabó el tiempo!</h1>
        <button class="btn btn-reiniciar" onclick="reiniciarJuego()">Intentar de nuevo</button>
    </div>

    <div id="pantalla-ganaste" class="pantalla-overlay oculto">
        <h1 style="color: #2ecc71;">¡SOS UN EXPERTO! 🎉</h1>
        <button class="btn btn-reiniciar" onclick="reiniciarTodoElJuego()">Volver al Inicio</button>
    </div>

    <script>
        const configuracionNiveles = [
            {
                nivel: 1, imagen: "img/nivel1.png", tiempo: 45,
                objetos: [
                    { id: "howie", nombre: "Howie", icono: "img/howie.png", top: "40%", left: "35%", encontrado: false },
                    { id: "objeto1", nombre: "Llave", icono: "img/llave.png", top: "20%", left: "70%", encontrado: false },
                    { id: "objeto2", nombre: "Valija", icono: "img/valija.png", top: "75%", left: "50%", encontrado: false }
                ]
            },
            {
                nivel: 2, imagen: "img/nivel2.png", tiempo: 40,
                objetos: [
                    { id: "howie", nombre: "Howie", icono: "img/howie.png", top: "60%", left: "80%", encontrado: false },
                    { id: "objeto1", nombre: "Arco", icono: "img/arco.png", top: "30%", left: "20%", encontrado: false },
                    { id: "objeto2", nombre: "Almohada", icono: "img/almohada.png", top: "15%", left: "55%", encontrado: false }
                ]
            },
            {
                nivel: 3, imagen: "img/nivel3.png", tiempo: 35,
                objetos: [
                    { id: "howie", nombre: "Howie", icono: "img/howie.png", top: "15%", left: "45%", encontrado: false },
                    { id: "objeto1", nombre: "Bici", icono: "img/bici.png", top: "85%", left: "15%", encontrado: false },
                    { id: "objeto2", nombre: "Kayak", icono: "img/kayak.png", top: "50%", left: "65%", encontrado: false }
                ]
            }
        ];

        let nivelActualIndex = 0, tiempoRestante = 0, intervaloTimer = null, juegoActivo = false, escalaActual = 1;

        function cambiarZoom(delta) {
            escalaActual += delta;
            if (escalaActual < 1) escalaActual = 1;
            if (escalaActual > 2.5) escalaActual = 2.5;
            document.getElementById("capa-interactiva").style.transform = `scale(${escalaActual})`;
        }

        function resetearZoom() {
            escalaActual = 1;
            document.getElementById("capa-interactiva").style.transform = "scale(1)";
        }

        function iniciarJuego() {
            document.getElementById("pantalla-inicio").classList.add("oculto");
            cargarNivel(0);
        }

        function cargarNivel(index) {
            resetearZoom();
            let datosNivel = configuracionNiveles[index];
            datosNivel.objetos.forEach(obj => obj.encontrado = false);

            document.getElementById("nivel-actual").innerText = `${datosNivel.nivel}/3`;
            document.getElementById("imagen-fondo").src = datosNivel.imagen;
            tiempoRestante = datosNivel.tiempo;
            document.getElementById("timer").innerText = `⏱️ ${tiempoRestante}`;

            const contenedorObjetivos = document.getElementById("objetivos");
            contenedorObjetivos.innerHTML = "";
            datosNivel.objetos.forEach(obj => {
                let div = document.createElement("div");
                div.id = `ui-${obj.id}`;
                div.className = "objetivo-item";
                div.innerHTML = `<img src="${obj.icono}"><span>${obj.nombre}</span>`;

                const activarLupa = (e) => { e.preventDefault(); document.getElementById("lupa-img").src = obj.icono; document.getElementById("lupa-preview").classList.add("activa"); };
                const desactivarLupa = () => document.getElementById("lupa-preview").classList.remove("activa");
                div.addEventListener("touchstart", activarLupa, { passive: false });
                div.addEventListener("touchend", desactivarLupa);
                div.addEventListener("mousedown", activarLupa);
                div.addEventListener("mouseup", desactivarLupa);

                contenedorObjetivos.appendChild(div);
            });

            const contenedorObjetos = document.getElementById("contenedor-objetos");
            contenedorObjetos.innerHTML = "";
            datosNivel.objetos.forEach(obj => {
                let divTarget = document.createElement("div");
                divTarget.className = "click-target";
                divTarget.style.top = obj.top;
                divTarget.style.left = obj.left;
                
                divTarget.onclick = function() {
                    if (!obj.encontrado) {
                        obj.encontrado = true;
                        document.getElementById(`ui-${obj.id}`).classList.add("encontrado");
                        divTarget.classList.add("marcado-exito"); // Cambia a verde al tocar
                        
                        if (datosNivel.objetos.every(o => o.encontrado)) {
                            juegoActivo = false;
                            clearInterval(intervaloTimer);
                            if (nivelActualIndex === 2) document.getElementById("pantalla-ganaste").classList.remove("oculto");
                            else document.getElementById("pantalla-siguiente").classList.remove("oculto");
                        }
                    }
                };
                contenedorObjetos.appendChild(divTarget);
            });

            juegoActivo = true;
            clearInterval(intervaloTimer);
            intervaloTimer = setInterval(() => {
                if (!juegoActivo) return;
                tiempoRestante--;
                document.getElementById("timer").innerText = `⏱️ ${tiempoRestante}`;
                if (tiempoRestante <= 0) { juegoActivo = false; clearInterval(intervaloTimer); document.getElementById("pantalla-perdiste").classList.remove("oculto"); }
            }, 1000);
        }

        function cargarNivelSiguiente() { document.getElementById("pantalla-siguiente").classList.add("oculto"); nivelActualIndex++; cargarNivel(nivelActualIndex); }
        function reiniciarJuego() { document.getElementById("pantalla-perdiste").classList.add("oculto"); cargarNivel(nivelActualIndex); }
        function reiniciarTodoElJuego() { document.getElementById("pantalla-ganaste").classList.add("oculto"); document.getElementById("pantalla-inicio").classList.remove("oculto"); }
    </script>
</body>
</html>
